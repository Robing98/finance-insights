name: Bug report
description: Something is calculated wrong or the integration fails.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach your real CSV export, account numbers, or screenshots with personal data.
        Anonymize the rows that reproduce the problem.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Home Assistant version and integration version.
      placeholder: "Home Assistant 2026.9.1, Finance Insights 0.2.0"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Data source
      options:
        - CSV export only
        - CSV export and pytr
        - pytr only
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: Settings > System > Logs, filtered for finance_insights.
      render: text
