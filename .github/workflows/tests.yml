name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Actions are pinned to a commit, not a tag. A tag can be moved to other code; a commit cannot.
# To update one: git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest -q

  pins:
    name: Pinned requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      # Fails when pip would install a version that is not in the pinned lists.
      - run: python scripts/check_pins.py

  secrets:
    name: No credentials in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      # A published FinTS product ID can be blocked, which locks out every legitimate user.
      - run: python scripts/check_secrets.py
