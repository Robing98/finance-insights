# Finance Insights theme. The build_dashboard action writes this file into /config/themes and
# overwrites it on updates, so copy it under another name if you want to change it.
Finance Insights:
  primary-font-family: '"IBM Plex Sans", Roboto, system-ui, sans-serif'
  ha-font-family-body: "var(--primary-font-family)"
  ha-font-family-heading: '"Space Grotesk", "IBM Plex Sans", system-ui, sans-serif'
  ha-card-border-radius: "16px"
  ha-card-border-width: "1px"
  ha-card-box-shadow: "none"
  modes:
    dark:
      primary-background-color: "#0f1311"
      lovelace-background: "#0f1311"
      secondary-background-color: "#161b18"
      card-background-color: "#161b18"
      ha-card-background: "#161b18"
      ha-card-border-color: "#29302c"
      divider-color: "#29302c"
      primary-text-color: "#e8ede9"
      secondary-text-color: "#9aa59f"
      disabled-text-color: "#6b766f"
      primary-color: "#5fd4a4"
      accent-color: "#5fd4a4"
      text-primary-color: "#0f1311"
      state-icon-color: "#9aa59f"
      app-header-background-color: "#0f1311"
      app-header-text-color: "#e8ede9"
      app-header-selection-bar-color: "#5fd4a4"
      app-header-border-bottom: "1px solid #29302c"
      fi-card: "#161b18"
      fi-surface: "#1d2320"
      fi-line: "#29302c"
      fi-text: "#e8ede9"
      fi-muted: "#9aa59f"
      fi-axis: "#7f8a84"
      fi-inverse: "#0f1311"
      fi-mint: "#5fd4a4"
      fi-coral: "#f2876a"
      fi-violet: "#9aa7ff"
      fi-sky: "#6cc3e8"
      fi-amber: "#e8b44f"
      fi-rose: "#e58fb4"
    light:
      primary-background-color: "#f4f3ee"
      lovelace-background: "#f4f3ee"
      secondary-background-color: "#ffffff"
      card-background-color: "#ffffff"
      ha-card-background: "#ffffff"
      ha-card-border-color: "#e3e1d8"
      divider-color: "#e3e1d8"
      primary-text-color: "#1a1f1c"
      secondary-text-color: "#5d6862"
      disabled-text-color: "#8b938e"
      primary-color: "#0f8a5f"
      accent-color: "#0f8a5f"
      text-primary-color: "#ffffff"
      state-icon-color: "#5d6862"
      app-header-background-color: "#f4f3ee"
      app-header-text-color: "#1a1f1c"
      app-header-selection-bar-color: "#0f8a5f"
      app-header-border-bottom: "1px solid #e3e1d8"
      fi-card: "#ffffff"
      fi-surface: "#f0efe9"
      fi-line: "#e3e1d8"
      fi-text: "#1a1f1c"
      fi-muted: "#5d6862"
      fi-axis: "#737d77"
      fi-inverse: "#ffffff"
      fi-mint: "#0f8a5f"
      fi-coral: "#c4502f"
      fi-violet: "#4a5bd4"
      fi-sky: "#1f7fae"
      fi-amber: "#a86b00"
      fi-rose: "#b0467a"
