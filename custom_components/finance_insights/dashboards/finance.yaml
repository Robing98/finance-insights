# Finance Insights: overview and bank account dashboard.
# Settings > Dashboards > Add dashboard > New dashboard from scratch,
# then open it, select Edit > three-dot menu > Raw configuration editor, and paste this file.
# Charts need apexcharts-card from HACS.
# The entity IDs use the account name. If your bank entry is not called "Sparkasse",
# replace sensor.sparkasse_ with sensor.<your_account_name>_.
# To keep everything in one dashboard, copy these views into the views list of depot.yaml.
title: Finances
views:
- title: Overview
  path: overview
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Net worth
    - type: tile
      entity: sensor.finance_overview_net_worth
    - type: tile
      entity: sensor.finance_overview_liquid
    - type: tile
      entity: sensor.finance_overview_invested
    - type: tile
      entity: sensor.finance_overview_savings_rate_12m
    - type: custom:apexcharts-card
      header:
        show: true
        title: Where your money is
        show_states: false
      chart_type: donut
      apex_config:
        legend:
          position: bottom
        dataLabels:
          formatter: EVAL:function(val){return val.toFixed(0) + ' %'}
        plotOptions:
          pie:
            donut:
              size: 62%
              labels:
                show: true
                value:
                  formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
                total:
                  show: true
                  showAlways: true
                  label: Net worth
                  formatter: EVAL:function(w){var v=w.globals.seriesTotals.reduce(function(a,b){return a+b},0);return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
      series:
      - entity: sensor.finance_overview_net_worth
        name: Bank accounts
        color: '#1baf7a'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.split || {})['Bank accounts'] || 0) * 100) / 100)]];
      - entity: sensor.finance_overview_net_worth
        name: Broker cash
        color: '#4fb3bf'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.split || {})['Broker cash'] || 0) * 100) / 100)]];
      - entity: sensor.finance_overview_net_worth
        name: Investments
        color: '#2a78d6'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.split || {})['Investments'] || 0) * 100) / 100)]];
      grid_options:
        columns: full
    - type: statistics-graph
      title: Net worth
      chart_type: line
      period: week
      days_to_show: 365
      stat_types:
      - mean
      entities:
      - sensor.finance_overview_net_worth
      - sensor.finance_overview_invested
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Cash flow
    - type: tile
      entity: sensor.finance_overview_income_month
    - type: tile
      entity: sensor.finance_overview_spending_month
    - type: tile
      entity: sensor.finance_overview_avg_income_12m
    - type: tile
      entity: sensor.finance_overview_avg_spending_12m
    - type: tile
      entity: sensor.finance_overview_to_depot_12m
    - type: custom:apexcharts-card
      header:
        show: true
        title: Income, spending, and invested per month
        show_states: false
      graph_span: 12month
      span:
        end: month
      yaxis:
      - decimals: 0
        apex_config:
          labels:
            formatter: EVAL:function(v){return Math.round(v) + ' €'}
      apex_config:
        chart:
          stacked: false
        legend:
          show: true
        plotOptions:
          bar:
            columnWidth: 75%
        tooltip:
          shared: true
          intersect: false
          y:
            formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
      series:
      - entity: sensor.finance_overview_income_month
        name: Income
        color: '#1baf7a'
        type: column
        data_generator: return (entity.attributes.monthly || []).slice(-12).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['income'] || 0]);
      - entity: sensor.finance_overview_income_month
        name: Spending
        color: '#eb6834'
        type: column
        data_generator: return (entity.attributes.monthly || []).slice(-12).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['spending'] || 0]);
      - entity: sensor.finance_overview_income_month
        name: Invested
        color: '#2a78d6'
        type: line
        data_generator: return (entity.attributes.monthly || []).slice(-12).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['to_depot'] || 0]);
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Accounts
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v or 0) | replace(',', 'X') | replace('.', ',') | replace('X', '.') }} €{%- endmacro -%}
        | Account | Type | Balance | Invested |
        |:--|:--|--:|--:|
        {%- for a in state_attr('sensor.finance_overview_net_worth', 'accounts') or [] %}
        {%- if a.type == 'bank' %}
        | {{ a.name }} | Bank | {{ eur(a.balance) if a.balance is not none else 'no balance yet' }} | |
        {%- else %}
        | {{ a.name }} | Broker | {{ eur(a.cash) }} | {{ eur(a.holdings) }} |
        {%- endif %}
        {%- endfor %}
- title: Sparkasse
  path: sparkasse
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Account
    - type: tile
      entity: sensor.sparkasse_balance
    - type: tile
      entity: sensor.sparkasse_income_month
    - type: tile
      entity: sensor.sparkasse_spending_month
    - type: tile
      entity: sensor.sparkasse_fixed_costs_month
    - type: tile
      entity: sensor.sparkasse_savings_rate_12m
    - type: tile
      entity: sensor.sparkasse_to_depot_12m
    - type: tile
      entity: sensor.sparkasse_last_salary
    - type: tile
      entity: sensor.sparkasse_avg_spending_12m
    - type: custom:apexcharts-card
      header:
        show: true
        title: Balance
        show_states: false
      graph_span: 24month
      span:
        end: month
      yaxis:
      - decimals: 0
        apex_config:
          labels:
            formatter: EVAL:function(v){return Math.round(v) + ' €'}
      apex_config:
        tooltip:
          y:
            formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
      series:
      - entity: sensor.sparkasse_balance
        name: Balance
        color: '#1baf7a'
        type: area
        data_generator: return (entity.attributes.history || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m.balance]);
      grid_options:
        columns: full
    - type: custom:apexcharts-card
      header:
        show: true
        title: Income and spending per month
        show_states: false
      graph_span: 24month
      span:
        end: month
      yaxis:
      - decimals: 0
        apex_config:
          labels:
            formatter: EVAL:function(v){return Math.round(v) + ' €'}
      apex_config:
        chart:
          stacked: false
        legend:
          show: true
        plotOptions:
          bar:
            columnWidth: 75%
        tooltip:
          shared: true
          intersect: false
          y:
            formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
      series:
      - entity: sensor.sparkasse_spending_month
        name: Income
        color: '#1baf7a'
        type: column
        data_generator: return (entity.attributes.monthly || []).slice(-24).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['income'] || 0]);
      - entity: sensor.sparkasse_spending_month
        name: Spending
        color: '#eb6834'
        type: column
        data_generator: return (entity.attributes.monthly || []).slice(-24).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['spending'] || 0]);
      - entity: sensor.sparkasse_spending_month
        name: To depot
        color: '#2a78d6'
        type: line
        data_generator: return (entity.attributes.monthly || []).slice(-24).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['to_depot'] || 0]);
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Spending
    - type: custom:apexcharts-card
      header:
        show: true
        title: Spending per month by group
        show_states: false
      graph_span: 24month
      span:
        end: month
      yaxis:
      - decimals: 0
        apex_config:
          labels:
            formatter: EVAL:function(v){return Math.round(v) + ' €'}
      apex_config:
        chart:
          stacked: true
        legend:
          show: true
        plotOptions:
          bar:
            columnWidth: 75%
        tooltip:
          shared: true
          intersect: false
          y:
            formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
      series:
      - entity: sensor.sparkasse_spending_month
        name: Housing
        color: '#1baf7a'
        type: column
        data_generator: return (entity.attributes.monthly || []).slice(-24).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Housing'] || 0]);
      - entity: sensor.sparkasse_spending_month
        name: Food and drink
        color: '#2a78d6'
        type: column
        data_generator: return (entity.attributes.monthly || []).slice(-24).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Food and drink'] || 0]);
      - entity: sensor.sparkasse_spending_month
        name: Shopping
        color: '#eb6834'
        type: column
        data_generator: return (entity.attributes.monthly || []).slice(-24).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Shopping'] || 0]);
      - entity: sensor.sparkasse_spending_month
        name: Mobility and travel
        color: '#e87ba4'
        type: column
        data_generator: return (entity.attributes.monthly || []).slice(-24).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Mobility and travel'] || 0]);
      - entity: sensor.sparkasse_spending_month
        name: Subscriptions and leisure
        color: '#eda100'
        type: column
        data_generator: return (entity.attributes.monthly || []).slice(-24).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Subscriptions and leisure'] || 0]);
      - entity: sensor.sparkasse_spending_month
        name: Insurance and health
        color: '#8a63d2'
        type: column
        data_generator: return (entity.attributes.monthly || []).slice(-24).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Insurance and health'] || 0]);
      - entity: sensor.sparkasse_spending_month
        name: Cash
        color: '#4fb3bf'
        type: column
        data_generator: return (entity.attributes.monthly || []).slice(-24).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Cash'] || 0]);
      - entity: sensor.sparkasse_spending_month
        name: Other
        color: '#898781'
        type: column
        data_generator: return (entity.attributes.monthly || []).slice(-24).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Other'] || 0]);
      grid_options:
        columns: full
    - type: custom:apexcharts-card
      header:
        show: true
        title: Where the money went (12 months)
        show_states: false
      chart_type: donut
      apex_config:
        legend:
          position: bottom
        dataLabels:
          formatter: EVAL:function(val){return val.toFixed(0) + ' %'}
        plotOptions:
          pie:
            donut:
              size: 62%
              labels:
                show: true
                value:
                  formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
                total:
                  show: true
                  showAlways: true
                  label: 12 months
                  formatter: EVAL:function(w){var v=w.globals.seriesTotals.reduce(function(a,b){return a+b},0);return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
      series:
      - entity: sensor.sparkasse_spending_month
        name: Housing
        color: '#1baf7a'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Housing'] || 0) * 100) / 100)]];
      - entity: sensor.sparkasse_spending_month
        name: Food and drink
        color: '#2a78d6'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Food and drink'] || 0) * 100) / 100)]];
      - entity: sensor.sparkasse_spending_month
        name: Shopping
        color: '#eb6834'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Shopping'] || 0) * 100) / 100)]];
      - entity: sensor.sparkasse_spending_month
        name: Mobility and travel
        color: '#e87ba4'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Mobility and travel'] || 0) * 100) / 100)]];
      - entity: sensor.sparkasse_spending_month
        name: Subscriptions and leisure
        color: '#eda100'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Subscriptions and leisure'] || 0) * 100) / 100)]];
      - entity: sensor.sparkasse_spending_month
        name: Insurance and health
        color: '#8a63d2'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Insurance and health'] || 0) * 100) / 100)]];
      - entity: sensor.sparkasse_spending_month
        name: Cash
        color: '#4fb3bf'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Cash'] || 0) * 100) / 100)]];
      - entity: sensor.sparkasse_spending_month
        name: Other
        color: '#898781'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Other'] || 0) * 100) / 100)]];
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v or 0) | replace(',', 'X') | replace('.', ',') | replace('X', '.') }} €{%- endmacro -%}
        **Top merchants this month**

        | Merchant | Amount | Bookings |
        |:--|--:|--:|
        {%- for m in state_attr('sensor.sparkasse_spending_month', 'merchants_month') or [] %}
        | {{ m[0] | title }} | {{ eur(m[1]) }} | {{ m[2] }} |
        {%- endfor %}
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v or 0) | replace(',', 'X') | replace('.', ',') | replace('X', '.') }} €{%- endmacro -%}
        **Top merchants (12 months)**

        | Merchant | Amount | Bookings | Avg. |
        |:--|--:|--:|--:|
        {%- for m in state_attr('sensor.sparkasse_spending_month', 'merchants_12m') or [] %}
        | {{ m[0] | title }} | {{ eur(m[1]) }} | {{ m[2] }} | {{ eur(m[1] / m[2]) }} |
        {%- endfor %}
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v or 0) | replace(',', 'X') | replace('.', ',') | replace('X', '.') }} €{%- endmacro -%}
        **Categories (12 months)**

        | Category | Amount | Per month |
        |:--|--:|--:|
        {%- for c in state_attr('sensor.sparkasse_spending_month', 'categories_12m') or [] %}
        | {{ c[0] }} | {{ eur(c[1]) }} | {{ eur(c[1] / 12) }} |
        {%- endfor %}
  - type: grid
    cards:
    - type: heading
      heading: Income and fixed costs
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v or 0) | replace(',', 'X') | replace('.', ',') | replace('X', '.') }} €{%- endmacro -%}
        **Fixed costs**

        | Payee | Category | Rhythm | Amount | Per month | Next |
        |:--|:--|:--|--:|--:|:--|
        {%- for r in state_attr('sensor.sparkasse_fixed_costs_month', 'recurring') or [] %}
        | {{ r.name | title }} | {{ r.category }} | {{ r.cadence }} | {{ eur(r.amount) }} | {{ eur(r.monthly) }} | {{ r.next_date }} |
        {%- endfor %}
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v or 0) | replace(',', 'X') | replace('.', ',') | replace('X', '.') }} €{%- endmacro -%}
        **Per year**

        | Year | Income | Spending | Saved | Avg. spending/month |
        |:--|--:|--:|--:|--:|
        {%- for y in state_attr('sensor.sparkasse_spending_month', 'by_year') or [] %}
        | {{ y.year }} | {{ eur(y.income) }} | {{ eur(y.spending) }} | {{ eur(y.saved) }} | {{ eur(y.avg_spending) }} |
        {%- endfor %}
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v or 0) | replace(',', 'X') | replace('.', ',') | replace('X', '.') }} €{%- endmacro -%}
        **Data**

        {% set s = states.sensor.sparkasse_data_status -%}
        Status: {{ s.state }} · CSV files: {{ (s.attributes.csv_files or []) | join(', ') }} · FinTS rows: {{ s.attributes.fints_rows }} · Transfers matched with the depot: {{ s.attributes.matched_transfers }}
        {%- if state_attr('sensor.sparkasse_balance', 'source') == 'none' %}

        No balance yet: the CSV export has no balance. Add balance.csv (iban,date,balance) to the export folder, or enable FinTS.
        {%- endif %}
