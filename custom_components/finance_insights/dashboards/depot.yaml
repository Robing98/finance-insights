# Finance Insights: Trade Republic dashboard.
# Settings > Dashboards > Add dashboard > New dashboard from scratch,
# then open it, select Edit > three-dot menu > Raw configuration editor, and paste this file.
# The Charts view needs apexcharts-card from HACS (HACS > search "apexcharts-card" > Download).
title: Depot
views:
- title: Depot
  path: depot
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Overview
    - type: tile
      entity: sensor.trade_republic_net_worth
    - type: tile
      entity: sensor.trade_republic_total_return
    - type: tile
      entity: sensor.trade_republic_holdings_value
    - type: tile
      entity: sensor.trade_republic_unrealized_pct
    - type: tile
      entity: sensor.trade_republic_cash
    - type: tile
      entity: sensor.trade_republic_realized
    - type: statistics-graph
      title: Net worth vs. contributions
      chart_type: line
      period: day
      days_to_show: 180
      stat_types:
      - mean
      entities:
      - sensor.trade_republic_net_worth
      - sensor.trade_republic_net_contributions
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Holdings
    - type: markdown
      content: '{%- set hs = states.sensor | selectattr(''attributes.trade_republic_holding'', ''defined'') | sort(attribute=''attributes.weight_pct'', reverse=true) | list %}

        | Position | Value | P&L | Dividends | Incl. div. | Share |

        |:--|--:|--:|--:|--:|--:|

        {%- for s in hs %}

        {%- set a = s.attributes %}

        | {{ s.name | replace(''Trade Republic '', '''') }} | {{ ''%.2f'' | format(s.state | float(0)) | replace(''.'', '','') }} € | {{ ''%+.1f'' | format(a.unrealized_pct | float(0)) | replace(''.'',
        '','') }} % | {{ (''%.2f'' | format(a.dividends) | replace(''.'', '','') ~ '' €'') if a.dividends else ''–'' }} | {{ (''%+.1f'' | format(a.return_incl_dividends_pct | float(0)) | replace(''.'',
        '','') ~ '' %'') if a.dividends else ''–'' }} | {{ ''%.1f'' | format(a.weight_pct | float(0)) | replace(''.'', '','') }} % |

        {%- endfor %}'
      grid_options:
        columns: full
    - type: markdown
      content: '{%- set hs = states.sensor | selectattr(''attributes.trade_republic_holding'', ''defined'') | sort(attribute=''attributes.weight_pct'', reverse=true) | list %}

        | Position | Value | P&L | Dividends | Incl. div. | Share |

        |:--|--:|--:|--:|--:|--:|

        {%- for s in hs %}

        {%- set a = s.attributes %}

        | {{ s.name | replace(''Trade Republic '', '''') }} | {{ ''%.2f'' | format(s.state | float(0)) | replace(''.'', '','') }} € | {{ ''%+.1f'' | format(a.unrealized_pct | float(0)) | replace(''.'',
        '','') }} % | {{ (''%.2f'' | format(a.dividends) | replace(''.'', '','') ~ '' €'') if a.dividends else ''–'' }} | {{ (''%+.1f'' | format(a.return_incl_dividends_pct | float(0)) | replace(''.'',
        '','') ~ '' %'') if a.dividends else ''–'' }} | {{ ''%.1f'' | format(a.weight_pct | float(0)) | replace(''.'', '','') }} % |

        {%- endfor %}'
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Bonds held to maturity
    - type: tile
      entity: sensor.trade_republic_bonds_profit_to_maturity
    - type: tile
      entity: sensor.trade_republic_next_bond_coupon
    - type: markdown
      content: '{%- set bonds = state_attr(''sensor.trade_republic_bonds_profit_to_maturity'', ''bonds'') or [] %}

        | Bond | Invested | Coupons in | Coupons due | Profit to maturity | p.a. |

        |:--|--:|--:|--:|--:|--:|

        {%- for b in bonds %}

        | {{ ''⚠️ '' if b.status != ''ok'' }}{{ b.name }} | {{ ''%.2f'' | format(b.invested) | replace(''.'', '','') }} € | {{ ''%.2f'' | format(b.coupons_received) | replace(''.'', '','') }} € | {{ (''%.2f''
        | format(b.coupons_due) | replace(''.'', '','') ~ '' €'') if b.coupons_due is not none else ''–'' }} | {{ (''%+.2f'' | format(b.profit_to_maturity) | replace(''.'', '','') ~ '' €'' ~ ('' (only if
        paid)'' if b.status == ''distressed'' else '''')) if b.profit_to_maturity is not none else ''–'' }} | {{ (''%.1f'' | format(b.return_pa) | replace(''.'', '','') ~ '' %'') if b.return_pa is not none
        else ''–'' }} |

        {%- endfor %}

        {% set doubtful = state_attr(''sensor.trade_republic_bonds_profit_to_maturity'', ''doubtful'') or [] %}

        {%- if doubtful %}


        ⚠️ Repayment doubtful for: {{ doubtful | join('', '') }}. A coupon was missed or the market price implies an extreme yield; the market value is the realistic figure.

        {%- endif %}


        Gross, before tax. Add `bonds.csv` (isin,coupon,maturity,frequency) to the export folder for bonds without known terms.'
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Data
    - type: entities
      title: Data
      state_color: true
      entities:
      - sensor.trade_republic_data_status
      - sensor.trade_republic_last_transaction
      - sensor.trade_republic_positions
      - button.trade_republic_refresh
- title: Charts
  path: charts
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Depot history
    - type: statistics-graph
      title: Investments, cash and contributions
      chart_type: line
      period: day
      days_to_show: 90
      stat_types:
      - mean
      entities:
      - sensor.trade_republic_holdings_value
      - sensor.trade_republic_net_worth
      - sensor.trade_republic_net_contributions
      grid_options:
        columns: full
    - type: statistics-graph
      title: Unrealized P&L %
      chart_type: line
      period: day
      days_to_show: 90
      stat_types:
      - mean
      entities:
      - sensor.trade_republic_unrealized_pct
      grid_options:
        columns: full
    - type: custom:apexcharts-card
      header:
        show: true
        title: Allocation
        show_states: false
      chart_type: donut
      series:
      - entity: sensor.trade_republic_holdings_value
        name: Stocks
        color: '#eb6834'
        data_generator: return [[Date.now(), Math.round(((entity.attributes.allocation || {}).STOCK || 0) * 100) / 100]];
      - entity: sensor.trade_republic_holdings_value
        name: Funds
        color: '#2a78d6'
        data_generator: return [[Date.now(), Math.round(((entity.attributes.allocation || {}).FUND || 0) * 100) / 100]];
      - entity: sensor.trade_republic_holdings_value
        name: Bonds
        color: '#1baf7a'
        data_generator: return [[Date.now(), Math.round(((entity.attributes.allocation || {}).BOND || 0) * 100) / 100]];
      - entity: sensor.trade_republic_holdings_value
        name: Crypto
        color: '#eda100'
        data_generator: return [[Date.now(), Math.round(((entity.attributes.allocation || {}).CRYPTO || 0) * 100) / 100]];
      grid_options:
        columns: full
      apex_config:
        legend:
          position: bottom
        dataLabels:
          formatter: EVAL:function(val){return val.toFixed(1).replace('.', ',') + ' %'}
        plotOptions:
          pie:
            donut:
              size: 62%
              labels:
                show: true
                name:
                  show: true
                value:
                  show: true
                  formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
                total:
                  show: true
                  showAlways: true
                  label: Total
                  formatter: EVAL:function(w){var v=w.globals.seriesTotals.reduce(function(a,b){return a+b},0);return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
  - type: grid
    cards:
    - type: heading
      heading: Last 12 months
    - type: custom:apexcharts-card
      graph_span: 12month
      span: &id001
        end: month
      yaxis: &id002
      - decimals: 0
        apex_config:
          labels:
            formatter: EVAL:function(v){return Math.round(v) + ' €'}
      apex_config: &id003
        legend:
          show: true
        plotOptions:
          bar:
            columnWidth: 70%
            borderRadius: 3
      grid_options: &id004
        columns: full
      header:
        show: true
        title: Money in and out
        show_states: false
      series:
      - entity: sensor.trade_republic_net_worth
        name: Deposits
        color: '#2a78d6'
        type: column
        data_generator: return (entity.attributes.last_12_months || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), Math.round(m.deposits)]);
      - entity: sensor.trade_republic_net_worth
        name: Card spending
        color: '#eb6834'
        type: column
        data_generator: return (entity.attributes.last_12_months || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), Math.round(m.spending)]);
      - entity: sensor.trade_republic_net_worth
        name: Net invested
        color: '#1baf7a'
        type: column
        data_generator: return (entity.attributes.last_12_months || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), Math.round(m.bought - m.sold)]);
    - type: custom:apexcharts-card
      graph_span: 12month
      span: *id001
      yaxis: *id002
      apex_config: *id003
      grid_options: *id004
      header:
        show: true
        title: Income and realized P&L
        show_states: false
      series:
      - entity: sensor.trade_republic_net_worth
        name: Income
        color: '#2a78d6'
        type: column
        data_generator: return (entity.attributes.last_12_months || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), Math.round(m.income * 100) / 100]);
      - entity: sensor.trade_republic_net_worth
        name: Realized P&L
        color: '#1baf7a'
        type: column
        data_generator: return (entity.attributes.last_12_months || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), Math.round(m.realized * 100) / 100]);
      - entity: sensor.trade_republic_net_worth
        name: Taxes
        color: '#e34948'
        type: column
        data_generator: return (entity.attributes.last_12_months || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), Math.round(-m.taxes * 100) / 100]);
- title: Income and spending
  path: income
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Income
    - type: tile
      entity: sensor.trade_republic_income_ytd
    - type: tile
      entity: sensor.trade_republic_dividends_ytd
    - type: tile
      entity: sensor.trade_republic_realized_ytd
    - type: tile
      entity: sensor.trade_republic_taxes_ytd
  - type: grid
    cards:
    - type: heading
      heading: Spending
    - type: tile
      entity: sensor.trade_republic_spending_month
    - type: tile
      entity: sensor.trade_republic_spending_prev_month
    - type: tile
      entity: sensor.trade_republic_spending_ytd
    - type: tile
      entity: sensor.trade_republic_spending_avg_12m
    - type: custom:apexcharts-card
      header:
        show: true
        title: Spending per month by group
        show_states: false
      graph_span: 24month
      span:
        end: month
      yaxis:
      - decimals: 0
        apex_config:
          labels:
            formatter: EVAL:function(v){return Math.round(v) + ' €'}
      apex_config:
        chart:
          stacked: true
        legend:
          show: true
        plotOptions:
          bar:
            columnWidth: 75%
        tooltip:
          shared: true
          intersect: false
          y:
            formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
      series:
      - entity: sensor.trade_republic_spending_ytd
        name: Food and drink
        color: '#2a78d6'
        type: column
        data_generator: return (entity.attributes.monthly || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Food and drink'] || 0]);
      - entity: sensor.trade_republic_spending_ytd
        name: Shopping
        color: '#eb6834'
        type: column
        data_generator: return (entity.attributes.monthly || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Shopping'] || 0]);
      - entity: sensor.trade_republic_spending_ytd
        name: Home
        color: '#1baf7a'
        type: column
        data_generator: return (entity.attributes.monthly || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Home'] || 0]);
      - entity: sensor.trade_republic_spending_ytd
        name: Subscriptions
        color: '#eda100'
        type: column
        data_generator: return (entity.attributes.monthly || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Subscriptions'] || 0]);
      - entity: sensor.trade_republic_spending_ytd
        name: Transport and travel
        color: '#e87ba4'
        type: column
        data_generator: return (entity.attributes.monthly || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Transport and travel'] || 0]);
      - entity: sensor.trade_republic_spending_ytd
        name: Other
        color: '#898781'
        type: column
        data_generator: return (entity.attributes.monthly || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m['Other'] || 0]);
      grid_options:
        columns: full
    - type: custom:apexcharts-card
      header:
        show: true
        title: Where the money went (12 months)
        show_states: false
      chart_type: donut
      apex_config:
        legend:
          position: bottom
        dataLabels:
          formatter: EVAL:function(val){return val.toFixed(0) + ' %'}
        plotOptions:
          pie:
            donut:
              size: 62%
              labels:
                show: true
                value:
                  formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
                total:
                  show: true
                  showAlways: true
                  label: 12 months
                  formatter: EVAL:function(w){var v=w.globals.seriesTotals.reduce(function(a,b){return a+b},0);return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
      series:
      - entity: sensor.trade_republic_spending_ytd
        name: Food and drink
        color: '#2a78d6'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Food and drink'] || 0) * 100) / 100)]];
      - entity: sensor.trade_republic_spending_ytd
        name: Shopping
        color: '#eb6834'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Shopping'] || 0) * 100) / 100)]];
      - entity: sensor.trade_republic_spending_ytd
        name: Home
        color: '#1baf7a'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Home'] || 0) * 100) / 100)]];
      - entity: sensor.trade_republic_spending_ytd
        name: Subscriptions
        color: '#eda100'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Subscriptions'] || 0) * 100) / 100)]];
      - entity: sensor.trade_republic_spending_ytd
        name: Transport and travel
        color: '#e87ba4'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Transport and travel'] || 0) * 100) / 100)]];
      - entity: sensor.trade_republic_spending_ytd
        name: Other
        color: '#898781'
        data_generator: return [[Date.now(), Math.max(0, Math.round(((entity.attributes.groups_12m || {})['Other'] || 0) * 100) / 100)]];
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: '**Per year**

        | Year | Total | Avg./month | Food | Shopping | Home | Subscr. | Transport | Other |

        |:--|--:|--:|--:|--:|--:|--:|--:|--:|

        {%- for y in (state_attr(''sensor.trade_republic_spending_ytd'', ''by_year'') or []) | reverse %}

        | {{ y.year }}{{ '' ('' ~ y.months ~ '' mo.)'' if y.months < 12 }} | {{ ''{:,.0f}''.format(y.total) | replace('','', ''X'') | replace(''.'', '','') | replace(''X'', ''.'') }} € | {{ ''{:,.0f}''.format(y.avg_month)
        | replace('','', ''X'') | replace(''.'', '','') | replace(''X'', ''.'') }} € | {{ ''%.0f'' | format(y[''Food and drink'']) }} | {{ ''%.0f'' | format(y[''Shopping'']) }} | {{ ''%.0f'' | format(y[''Home''])
        }} | {{ ''%.0f'' | format(y[''Subscriptions'']) }} | {{ ''%.0f'' | format(y[''Transport and travel'']) }} | {{ ''%.0f'' | format(y[''Other'']) }} |

        {%- endfor %}


        Group amounts in €. Refunds are netted in.'
  - type: grid
    cards:
    - type: heading
      heading: Where it goes
    - type: markdown
      grid_options:
        columns: full
      content: '**Categories, last 12 months**

        {%- set t = state_attr(''sensor.trade_republic_spending_ytd'', ''total_12m'') or 0 %}

        | Category | Amount | Share | Count |

        |:--|--:|--:|--:|

        {%- for c in state_attr(''sensor.trade_republic_spending_ytd'', ''categories_12m'') or [] %}

        | {{ c[0] }} | {{ ''{:,.2f}''.format(c[1]) | replace('','', ''X'') | replace(''.'', '','') | replace(''X'', ''.'') }} € | {{ (''%.0f'' | format(c[1] / t * 100)) if t else ''–'' }} % | {{ c[2] }}
        |

        {%- endfor %}'
    - type: markdown
      grid_options:
        columns: full
      content: '**Top merchants, last 12 months**

        | Merchant | Amount | Count | Avg. |

        |:--|--:|--:|--:|

        {%- for m in state_attr(''sensor.trade_republic_spending_ytd'', ''merchants_12m'') or [] %}

        | {{ m[0] | title }} | {{ ''{:,.2f}''.format(m[1]) | replace('','', ''X'') | replace(''.'', '','') | replace(''X'', ''.'') }} € | {{ m[2] }} | {{ ''{:,.2f}''.format(m[1] / m[2]) | replace('','',
        ''X'') | replace(''.'', '','') | replace(''X'', ''.'') }} € |

        {%- endfor %}'
    - type: markdown
      grid_options:
        columns: full
      content: '**This month**

        {%- set ms = state_attr(''sensor.trade_republic_spending_ytd'', ''merchants_month'') or [] %}

        {%- if ms %}

        | Merchant | Amount | Count |

        |:--|--:|--:|

        {%- for m in ms %}

        | {{ m[0] | title }} | {{ ''{:,.2f}''.format(m[1]) | replace('','', ''X'') | replace(''.'', '','') | replace(''X'', ''.'') }} € | {{ m[2] }} |

        {%- endfor %}

        {%- else %}


        No card spending yet this month.

        {%- endif %}'
- title: Dividends
  path: dividends
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Dividends
    - type: tile
      entity: sensor.trade_republic_dividend_income_forward
    - type: tile
      entity: sensor.trade_republic_dividends_12m
    - type: tile
      entity: sensor.trade_republic_dividend_yield
    - type: tile
      entity: sensor.trade_republic_dividend_yield_on_cost
    - type: tile
      entity: sensor.trade_republic_next_dividend
    - type: tile
      entity: sensor.trade_republic_real_dividend_yield
    - type: custom:apexcharts-card
      header:
        show: true
        title: Expected dividends, next 12 months
        show_states: false
      graph_span: 12month
      span:
        start: month
      yaxis:
      - decimals: 0
        apex_config:
          labels:
            formatter: EVAL:function(v){return Math.round(v) + ' €'}
      apex_config:
        tooltip:
          y:
            formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
      series:
      - entity: sensor.trade_republic_dividend_income_forward
        name: Expected
        color: '#1baf7a'
        type: column
        data_generator: return (entity.attributes.calendar || []).map(c => [new Date(c.month + '-15T00:00:00').getTime(), c.amount]);
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- macro pct(v) -%}{{ '%.2f' | format(v) | replace('.', ',') ~ ' %' if v is not none else '–' }}{%- endmacro -%}
        **Upcoming**

        | Stock | Ex date | Pay date | Per share | Total |
        |:--|:--|:--|--:|--:|
        {%- set up = state_attr('sensor.trade_republic_dividend_income_forward', 'upcoming') or [] %}
        {%- for u in up %}
        | {{ u.name }} | {{ u.next_ex_date or '–' }}{{ ' (est.)' if u.estimated and u.next_ex_date else '' }} | {{ u.next_pay_date or '–' }}{{ ' (est.)' if u.estimated and u.next_pay_date else '' }} | {{ eur(u.next_amount) }} | {{ eur(u.next_total) }} |
        {%- endfor %}
        {%- if not up %}

        No dividends expected yet. Add a dividend data provider under **Configure**, or wait for the first payment.
        {%- endif %}
  - type: grid
    cards:
    - type: heading
      heading: Per stock
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- macro pct(v) -%}{{ '%.2f' | format(v) | replace('.', ',') ~ ' %' if v is not none else '–' }}{%- endmacro -%}
        | Stock | Yield | On cost | Per year | Received | Paid back | Payback in | Growth p.a. | Years without cut |
        |:--|--:|--:|--:|--:|--:|--:|--:|--:|
        {%- for s in state_attr('sensor.trade_republic_dividend_yield', 'stocks') or [] %}
        | {{ s.name }} | {{ pct(s.yield_pct) }} | {{ pct(s.yield_on_cost_pct) }} | {{ eur(s.annual_income) }} | {{ eur(s.received) }} | {{ pct(s.payback_pct) }} | {{ ('%.1f' | format(s.years_to_payback) | replace('.', ',') ~ ' y') if s.years_to_payback is not none else '–' }} | {{ pct(s.growth_pct) }} | {{ s.years_without_cut if s.years_without_cut is not none else '–' }} |
        {%- endfor %}

        *Yield*: expected dividend per share over the current price. *On cost*: over your average buy-in. *Paid back*: dividends received over what you paid. *Payback in*: years until dividends cover the rest of the buy-in at today's rate. All gross, before tax.
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- macro pct(v) -%}{{ '%.2f' | format(v) | replace('.', ',') ~ ' %' if v is not none else '–' }}{%- endmacro -%}
        **Compared with other dividend stocks**

        | Stock | Where | Yield | Growth p.a. | Years without cut | Payments per year | Next ex date | After inflation |
        |:--|:--|--:|--:|--:|--:|:--|--:|
        {%- for s in state_attr('sensor.trade_republic_dividend_yield', 'ranking') or [] %}
        | {{ s.name }} | {{ 'Depot' if s.held else 'Watchlist' }} | {{ pct(s.yield_pct) }} | {{ pct(s.growth_pct) }} | {{ s.years_without_cut if s.years_without_cut is not none else '–' }} | {{ s.frequency or '–' }} | {{ s.next_ex_date or '–' }} | {{ pct(s.real_yield_pct) }} |
        {%- endfor %}
  - type: grid
    cards:
    - type: heading
      heading: Benchmarks
    - type: tile
      entity: sensor.trade_republic_ecb_deposit_rate
    - type: tile
      entity: sensor.trade_republic_inflation_rate
    - type: tile
      entity: sensor.trade_republic_tr_cash_interest_rate
    - type: custom:apexcharts-card
      header:
        show: true
        title: Dividend yield compared
        show_states: false
      graph_span: 1h
      span:
        end: hour
      apex_config:
        xaxis:
          labels:
            show: false
        legend:
          show: true
        tooltip:
          x:
            show: false
          y:
            formatter: 'EVAL:function(v){return v == null ? '''' : Number(v).toFixed(2).replace(''.'', '','') + '' %''}'
        plotOptions:
          bar:
            columnWidth: 80%
      yaxis:
      - decimals: 1
        apex_config:
          labels:
            formatter: 'EVAL:function(v){return v == null ? '''' : Number(v).toFixed(2).replace(''.'', '','') + '' %''}'
      series:
      - entity: sensor.trade_republic_dividend_yield
        name: Dividend yield
        color: '#1baf7a'
        type: column
        data_generator: 'const v = Number(entity.state); return v == null ? [] : [[Date.now(), Math.round(v * 100) / 100]];'
      - entity: sensor.trade_republic_dividend_yield
        name: Yield on cost
        color: '#0d7a55'
        type: column
        data_generator: 'const v = entity.attributes.yield_on_cost_pct; return v == null ? [] : [[Date.now(), Math.round(v * 100) / 100]];'
      - entity: sensor.trade_republic_tr_cash_interest_rate
        name: Cash interest
        color: '#4fb3bf'
        type: column
        data_generator: 'const v = Number(entity.state); return v == null ? [] : [[Date.now(), Math.round(v * 100) / 100]];'
      - entity: sensor.trade_republic_ecb_deposit_rate
        name: ECB deposit rate
        color: '#2a78d6'
        type: column
        data_generator: 'const v = Number(entity.state); return v == null ? [] : [[Date.now(), Math.round(v * 100) / 100]];'
      - entity: sensor.trade_republic_dividend_yield
        name: Bonds to maturity
        color: '#8a63d2'
        type: column
        data_generator: 'const v = (entity.attributes.benchmarks || {}).bonds_ytm; return v == null ? [] : [[Date.now(), Math.round(v * 100) / 100]];'
      - entity: sensor.trade_republic_inflation_rate
        name: Inflation
        color: '#eb6834'
        type: column
        data_generator: 'const v = Number(entity.state); return v == null ? [] : [[Date.now(), Math.round(v * 100) / 100]];'
      grid_options:
        columns: full
    - type: custom:apexcharts-card
      header:
        show: true
        title: Rates over time
        show_states: false
      graph_span: 36month
      span:
        end: month
      yaxis:
      - decimals: 1
        apex_config:
          labels:
            formatter: 'EVAL:function(v){return v == null ? '''' : Number(v).toFixed(2).replace(''.'', '','') + '' %''}'
      apex_config:
        tooltip:
          y:
            formatter: 'EVAL:function(v){return v == null ? '''' : Number(v).toFixed(2).replace(''.'', '','') + '' %''}'
        legend:
          show: true
      series:
      - entity: sensor.trade_republic_ecb_deposit_rate
        name: ECB deposit rate
        color: '#2a78d6'
        type: line
        curve: stepline
        data_generator: return (entity.attributes.history || []).map(h => [new Date(h.period + '-15T00:00:00').getTime(), h.value]);
      - entity: sensor.trade_republic_inflation_rate
        name: Inflation
        color: '#eb6834'
        type: line
        data_generator: return (entity.attributes.history || []).map(h => [new Date(h.period + '-15T00:00:00').getTime(), h.value]);
      - entity: sensor.trade_republic_dividend_yield
        name: Your dividend yield
        color: '#1baf7a'
        type: line
        data_generator: const v = Number(entity.state); if (isNaN(v)) return []; const now = new Date(); const start = new Date(now.getFullYear() - 3, now.getMonth(), 1); return [[start.getTime(), v], [now.getTime(),
          v]];
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- macro pct(v) -%}{{ '%.2f' | format(v) | replace('.', ',') ~ ' %' if v is not none else '–' }}{%- endmacro -%}
        **Dividends received per year**

        | Year | Gross |
        |:--|--:|
        {%- for y, v in (state_attr('sensor.trade_republic_dividend_income_forward', 'per_year') or {}).items() | reverse %}
        | {{ y }} | {{ eur(v) }} |
        {%- endfor %}

        {%- set b = state_attr('sensor.trade_republic_dividend_yield', 'benchmarks') or {} %}

        ECB deposit rate since {{ b.ecb_period or '–' }}, inflation for {{ b.inflation_period or '–' }}. Cash interest is derived from your last interest payment.
