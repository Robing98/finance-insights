# Dashboard building blocks for the build_dashboard action.
# Per account type and topic: a list of sections. English texts; de.yaml has the German ones.
# Markdown cards can use dt(date) and tr.get(value, value), which the builder defines per language.
# Entity IDs use the default prefixes
# (trade_republic, sparkasse, finance_overview, electricity) and are rewritten for each account.
trade_republic:
  overview:
  - type: grid
    cards:
    - type: heading
      heading: Trade Republic
    - type: tile
      entity: sensor.trade_republic_net_worth
    - type: tile
      entity: sensor.trade_republic_total_return
    - type: tile
      entity: sensor.trade_republic_unrealized_pct
    - type: tile
      entity: sensor.trade_republic_cash
    - type: tile
      entity: sensor.trade_republic_dividend_income_forward
    - type: tile
      entity: sensor.trade_republic_next_dividend
    - type: tile
      entity: sensor.trade_republic_spending_month
    - type: tile
      entity: sensor.trade_republic_income_ytd
  portfolio:
  - type: grid
    cards:
    - type: heading
      heading: Portfolio
    - type: tile
      entity: sensor.trade_republic_net_worth
    - type: tile
      entity: sensor.trade_republic_total_return
    - type: tile
      entity: sensor.trade_republic_holdings_value
    - type: tile
      entity: sensor.trade_republic_unrealized_pct
    - type: tile
      entity: sensor.trade_republic_cash
    - type: tile
      entity: sensor.trade_republic_realized
    - type: statistics-graph
      title: Net worth vs. contributions
      chart_type: line
      period: day
      days_to_show: 180
      stat_types:
      - mean
      entities:
      - sensor.trade_republic_net_worth
      - sensor.trade_republic_net_contributions
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Holdings
    - type: markdown
      content: |
        {%- set hs = states.sensor | selectattr('attributes.trade_republic_holding', 'defined') | sort(attribute='attributes.weight_pct', reverse=true) | list %}
        | Position | Value | P&L | Dividends | Incl. div. | Share |
        |:--|--:|--:|--:|--:|--:|
        {%- for s in hs %}
        {%- set a = s.attributes %}
        | {{ s.name | replace('Trade Republic ', '') }} | {{ '%.2f' | format(s.state | float(0)) | replace('.', ',') }} € | {{ '%+.1f' | format(a.unrealized_pct | float(0)) | replace('.', ',') }} % | {{ ('%.2f' | format(a.dividends) | replace('.', ',') ~ ' €') if a.dividends else '–' }} | {{ ('%+.1f' | format(a.return_incl_dividends_pct | float(0)) | replace('.', ',') ~ ' %') if a.dividends else '–' }} | {{ '%.1f' | format(a.weight_pct | float(0)) | replace('.', ',') }} % |
        {%- endfor %}
      grid_options:
        columns: full
    - type: custom:apexcharts-card
      header:
        show: true
        title: Allocation
        show_states: false
      chart_type: donut
      series:
      - entity: sensor.trade_republic_holdings_value
        name: Stocks
        color: '#eb6834'
        data_generator: return [[Date.now(), Math.round(((entity.attributes.allocation || {}).STOCK || 0) * 100) / 100]];
      - entity: sensor.trade_republic_holdings_value
        name: Funds
        color: '#2a78d6'
        data_generator: return [[Date.now(), Math.round(((entity.attributes.allocation || {}).FUND || 0) * 100) / 100]];
      - entity: sensor.trade_republic_holdings_value
        name: Bonds
        color: '#1baf7a'
        data_generator: return [[Date.now(), Math.round(((entity.attributes.allocation || {}).BOND || 0) * 100) / 100]];
      - entity: sensor.trade_republic_holdings_value
        name: Crypto
        color: '#eda100'
        data_generator: return [[Date.now(), Math.round(((entity.attributes.allocation || {}).CRYPTO || 0) * 100) / 100]];
      grid_options:
        columns: full
      apex_config:
        legend:
          position: bottom
        dataLabels:
          formatter: EVAL:function(val){return val.toFixed(1).replace('.', ',') + ' %'}
        plotOptions:
          pie:
            donut:
              size: 62%
              labels:
                show: true
                name:
                  show: true
                value:
                  show: true
                  formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
                total:
                  show: true
                  showAlways: true
                  label: Total
                  formatter: EVAL:function(w){var v=w.globals.seriesTotals.reduce(function(a,b){return a+b},0);return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
  bonds:
  - type: grid
    cards:
    - type: heading
      heading: Bonds held to maturity
    - type: tile
      entity: sensor.trade_republic_bonds_profit_to_maturity
    - type: tile
      entity: sensor.trade_republic_next_bond_coupon
    - type: markdown
      content: |
        {%- set bonds = state_attr('sensor.trade_republic_bonds_profit_to_maturity', 'bonds') or [] %}
        | Bond | Invested | Coupons in | Coupons due | Profit to maturity | p.a. |
        |:--|--:|--:|--:|--:|--:|
        {%- for b in bonds %}
        | {{ '⚠️ ' if b.status != 'ok' }}{{ b.name }} | {{ '%.2f' | format(b.invested) | replace('.', ',') }} € | {{ '%.2f' | format(b.coupons_received) | replace('.', ',') }} € | {{ ('%.2f' | format(b.coupons_due) | replace('.', ',') ~ ' €') if b.coupons_due is not none else '–' }} | {{ ('%+.2f' | format(b.profit_to_maturity) | replace('.', ',') ~ ' €' ~ (' (only if paid)' if b.status == 'distressed' else '')) if b.profit_to_maturity is not none else '–' }} | {{ ('%.1f' | format(b.return_pa) | replace('.', ',') ~ ' %') if b.return_pa is not none else '–' }} |
        {%- endfor %}
        {% set doubtful = state_attr('sensor.trade_republic_bonds_profit_to_maturity', 'doubtful') or [] %}
        {%- if doubtful %}

        ⚠️ Repayment doubtful for: {{ doubtful | join(', ') }}. A coupon was missed or the market price implies an extreme yield; the market value is the realistic figure.
        {%- endif %}

        Gross, before tax. Add `bonds.csv` (isin,coupon,maturity,frequency) to the export folder for bonds without known terms.
      grid_options:
        columns: full
  dividends:
  - type: grid
    cards:
    - type: heading
      heading: Dividends
    - type: tile
      entity: sensor.trade_republic_dividend_income_forward
    - type: tile
      entity: sensor.trade_republic_dividends_12m
    - type: tile
      entity: sensor.trade_republic_dividend_yield
    - type: tile
      entity: sensor.trade_republic_dividend_yield_on_cost
    - type: tile
      entity: sensor.trade_republic_next_dividend
    - type: tile
      entity: sensor.trade_republic_real_dividend_yield
    - type: custom:apexcharts-card
      header:
        show: true
        title: Expected dividends, next 12 months
        show_states: false
      graph_span: 12month
      span:
        start: month
      yaxis:
      - decimals: 0
        apex_config:
          labels:
            formatter: EVAL:function(v){return Math.round(v) + ' €'}
      apex_config:
        tooltip:
          y:
            formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
      series:
      - entity: sensor.trade_republic_dividend_income_forward
        name: Expected
        color: '#1baf7a'
        type: column
        data_generator: return (entity.attributes.calendar || []).map(c => [new Date(c.month + '-15T00:00:00').getTime(), c.amount]);
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- macro pct(v) -%}{{ '%.2f' | format(v) | replace('.', ',') ~ ' %' if v is not none else '–' }}{%- endmacro -%}
        **Upcoming**

        | Stock | Ex date | Pay date | Per share | Total |
        |:--|:--|:--|--:|--:|
        {%- set up = state_attr('sensor.trade_republic_dividend_income_forward', 'upcoming') or [] %}
        {%- for u in up %}
        | {{ u.name }} | {{ dt(u.next_ex_date) }}{{ ' (est.)' if u.estimated and u.next_ex_date else '' }} | {{ dt(u.next_pay_date) }}{{ ' (est.)' if u.estimated and u.next_pay_date else '' }} | {{ eur(u.next_amount) }} | {{ eur(u.next_total) }} |
        {%- endfor %}
        {%- if not up %}

        No dividends expected yet. Add a dividend data provider under **Configure**, or wait for the first payment.
        {%- endif %}
  - type: grid
    cards:
    - type: heading
      heading: Per stock
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- macro pct(v) -%}{{ '%.2f' | format(v) | replace('.', ',') ~ ' %' if v is not none else '–' }}{%- endmacro -%}
        | Stock | Yield | On cost | Per year | Received | Paid back | Payback in | Growth p.a. | Years without cut |
        |:--|--:|--:|--:|--:|--:|--:|--:|--:|
        {%- for s in state_attr('sensor.trade_republic_dividend_yield', 'stocks') or [] %}
        | {{ s.name }} | {{ pct(s.yield_pct) }} | {{ pct(s.yield_on_cost_pct) }} | {{ eur(s.annual_income) }} | {{ eur(s.received) }} | {{ pct(s.payback_pct) }} | {{ ('%.1f' | format(s.years_to_payback) | replace('.', ',') ~ ' y') if s.years_to_payback is not none else '–' }} | {{ pct(s.growth_pct) }} | {{ s.years_without_cut if s.years_without_cut is not none else '–' }} |
        {%- endfor %}

        *Yield*: expected dividend per share over the current price. *On cost*: over your average buy-in. *Paid back*: dividends received over what you paid. *Payback in*: years until dividends cover the rest of the buy-in at today's rate. All gross, before tax.
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- macro pct(v) -%}{{ '%.2f' | format(v) | replace('.', ',') ~ ' %' if v is not none else '–' }}{%- endmacro -%}
        **Compared with other dividend stocks**

        | Stock | Where | Yield | Growth p.a. | Years without cut | Payments per year | Next ex date | After inflation |
        |:--|:--|--:|--:|--:|--:|:--|--:|
        {%- for s in state_attr('sensor.trade_republic_dividend_yield', 'ranking') or [] %}
        | {{ s.name }} | {{ 'Depot' if s.held else 'Watchlist' }} | {{ pct(s.yield_pct) }} | {{ pct(s.growth_pct) }} | {{ s.years_without_cut if s.years_without_cut is not none else '–' }} | {{ s.frequency or '–' }} | {{ dt(s.next_ex_date) }} | {{ pct(s.real_yield_pct) }} |
        {%- endfor %}
  - type: grid
    cards:
    - type: heading
      heading: Benchmarks
    - type: tile
      entity: sensor.trade_republic_ecb_deposit_rate
    - type: tile
      entity: sensor.trade_republic_inflation_rate
    - type: tile
      entity: sensor.trade_republic_tr_cash_interest_rate
    - type: custom:apexcharts-card
      header:
        show: true
        title: Dividend yield compared
        show_states: false
      graph_span: 1h
      span:
        end: hour
      apex_config:
        xaxis:
          labels:
            show: false
        legend:
          show: true
        tooltip:
          x:
            show: false
          y:
            formatter: 'EVAL:function(v){return v == null ? '''' : Number(v).toFixed(2).replace(''.'', '','') + '' %''}'
        plotOptions:
          bar:
            columnWidth: 80%
      yaxis:
      - decimals: 1
        apex_config:
          labels:
            formatter: 'EVAL:function(v){return v == null ? '''' : Number(v).toFixed(2).replace(''.'', '','') + '' %''}'
      series:
      - entity: sensor.trade_republic_dividend_yield
        name: Dividend yield
        color: '#1baf7a'
        type: column
        data_generator: 'const v = Number(entity.state); return v == null ? [] : [[Date.now(), Math.round(v * 100) / 100]];'
      - entity: sensor.trade_republic_dividend_yield
        name: Yield on cost
        color: '#0d7a55'
        type: column
        data_generator: 'const v = entity.attributes.yield_on_cost_pct; return v == null ? [] : [[Date.now(), Math.round(v * 100) / 100]];'
      - entity: sensor.trade_republic_tr_cash_interest_rate
        name: Cash interest
        color: '#4fb3bf'
        type: column
        data_generator: 'const v = Number(entity.state); return v == null ? [] : [[Date.now(), Math.round(v * 100) / 100]];'
      - entity: sensor.trade_republic_ecb_deposit_rate
        name: ECB deposit rate
        color: '#2a78d6'
        type: column
        data_generator: 'const v = Number(entity.state); return v == null ? [] : [[Date.now(), Math.round(v * 100) / 100]];'
      - entity: sensor.trade_republic_dividend_yield
        name: Bonds to maturity
        color: '#8a63d2'
        type: column
        data_generator: 'const v = (entity.attributes.benchmarks || {}).bonds_ytm; return v == null ? [] : [[Date.now(), Math.round(v * 100) / 100]];'
      - entity: sensor.trade_republic_inflation_rate
        name: Inflation
        color: '#eb6834'
        type: column
        data_generator: 'const v = Number(entity.state); return v == null ? [] : [[Date.now(), Math.round(v * 100) / 100]];'
      grid_options:
        columns: full
    - type: custom:apexcharts-card
      header:
        show: true
        title: Rates over time
        show_states: false
      graph_span: 36month
      span:
        end: month
      yaxis:
      - decimals: 1
        apex_config:
          labels:
            formatter: 'EVAL:function(v){return v == null ? '''' : Number(v).toFixed(2).replace(''.'', '','') + '' %''}'
      apex_config:
        tooltip:
          y:
            formatter: 'EVAL:function(v){return v == null ? '''' : Number(v).toFixed(2).replace(''.'', '','') + '' %''}'
        legend:
          show: true
      series:
      - entity: sensor.trade_republic_ecb_deposit_rate
        name: ECB deposit rate
        color: '#2a78d6'
        type: line
        curve: stepline
        data_generator: return (entity.attributes.history || []).map(h => [new Date(h.period + '-15T00:00:00').getTime(), h.value]);
      - entity: sensor.trade_republic_inflation_rate
        name: Inflation
        color: '#eb6834'
        type: line
        data_generator: return (entity.attributes.history || []).map(h => [new Date(h.period + '-15T00:00:00').getTime(), h.value]);
      - entity: sensor.trade_republic_dividend_yield
        name: Your dividend yield
        color: '#1baf7a'
        type: line
        data_generator: const v = Number(entity.state); if (isNaN(v)) return []; const now = new Date(); const start = new Date(now.getFullYear() - 3, now.getMonth(), 1); return [[start.getTime(), v], [now.getTime(),
          v]];
      grid_options:
        columns: full
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- macro pct(v) -%}{{ '%.2f' | format(v) | replace('.', ',') ~ ' %' if v is not none else '–' }}{%- endmacro -%}
        **Dividends received per year**

        | Year | Gross |
        |:--|--:|
        {%- for y, v in (state_attr('sensor.trade_republic_dividend_income_forward', 'per_year') or {}).items() | reverse %}
        | {{ y }} | {{ eur(v) }} |
        {%- endfor %}

        {%- set b = state_attr('sensor.trade_republic_dividend_yield', 'benchmarks') or {} %}

        ECB deposit rate since {{ dt(b.ecb_period) }}, inflation for {{ dt(b.inflation_period) }}. Cash interest is derived from your last interest payment.
  taxes:
  - type: grid
    cards:
    - type: heading
      heading: Taxes
    - type: tile
      entity: sensor.trade_republic_tax_allowance_left
    - type: tile
      entity: sensor.trade_republic_tax_expected
    - type: tile
      entity: sensor.trade_republic_taxes_ytd
    - type: tile
      entity: sensor.trade_republic_tax_refund_estimate
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- set tips = state_attr('sensor.trade_republic_tax_allowance_left', 'tips') or [] %}
        {%- for x in tips %}
        {%- if x.code == 'enter_income' %}
        - **Günstigerprüfung and NV-Bescheinigung:** enter your expected taxable income without capital income under **Configure** to see whether either pays off.
        {%- elif x.code == 'nv' %}
        - **NV-Bescheinigung:** your estimated income stays below the basic allowance. With an NV-Bescheinigung from the tax office (form NV 1 A), Trade Republic withholds no tax. Tax withheld this year so far: {{ eur(x.amount) }}, which comes back with the tax return.
        {%- elif x.code == 'guenstiger' %}
        - **Günstigerprüfung:** your personal tax rate is below 25 %. Estimated refund when you apply for it in Anlage KAP: {{ eur(x.amount) }}.
        {%- elif x.code == 'reset' %}
        - **Unused allowance:** about {{ eur(x.amount) }} are unused this year. Gains realized by December 31 up to that amount stay tax free for good, even if you buy the position back right away. Tax saved later: about {{ eur(x.benefit) }}. Selling and buying back on the same day is not an abuse of law (BFH, IX R 60/07).
        {%- elif x.code == 'losses' %}
        - **Unrealized losses:** tax is withheld on part of your capital income this year. A realized loss offsets it. Saving for the largest one right now: {{ eur(x.amount) }}.
        {%- elif x.code == 'stock_pot' %}
        - **Stock loss pot:** about {{ eur(x.amount) }}. It only offsets gains from selling stocks, not dividends, interest, or ETF gains.
        {%- elif x.code == 'loss_certificate' %}
        - **Loss certificate:** to offset losses at Trade Republic against gains at another bank, request a Verlustbescheinigung by December 15. Otherwise the loss pot carries over at Trade Republic.
        {%- elif x.code == 'fsa' %}
        - **Freistellungsauftrag:** {{ eur(x.amount) }} at Trade Republic, and tax is already withheld. Without capital income at other banks, it can go up to {{ eur(x.limit) }}. You change it in the app.
        {%- elif x.code == 'crypto_free' %}
        - **{{ x.name }}:** tax free sale of the oldest taxable purchase from {{ dt(x.date) }}.
        {%- elif x.code == 'crypto_limit' and x.over %}
        - **Crypto sold within one year:** {{ eur(x.amount) }} gain this year. That is above the {{ eur(x.limit) }} limit, so the whole gain belongs in your tax return as a private sale.
        {%- elif x.code == 'crypto_limit' %}
        - **Crypto sold within one year:** {{ eur(x.amount) }} gain this year. It stays tax free while all such gains together stay below {{ eur(x.limit) }}. Above that, the whole gain is taxed.
        {%- elif x.code == 'crypto_rewards' %}
        - **Crypto rewards:** {{ eur(x.amount) }} this year. They count as other income. Tax free limit for all such income together: {{ eur(x.limit) }}.
        {%- elif x.code == 'vorabpauschale' %}
        - **Vorabpauschale:** accumulating ETFs are taxed on the first working day of January. The new year's allowance is used first, any tax beyond it is taken from your cash.
        {%- endif %}
        {%- endfor %}

        *Estimates from your exports, not tax advice. Trade Republic's tax report and your tax assessment are binding.*
  - type: grid
    cards:
    - type: heading
      heading: This year
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- macro pct(v) -%}{{ '%.1f' | format(v) | replace('.', ',') ~ ' %' if v is not none else '–' }}{%- endmacro -%}
        {%- set a = states.sensor.trade_republic_tax_allowance_left.attributes if states.sensor.trade_republic_tax_allowance_left is defined else {} %}
        {%- set p = a.personal %}
        | Item | Amount |
        |:--|--:|
        | Capital income so far, taxable part | {{ eur(a.income_ytd) }} |
        | Realized gains and losses, taxable part | {{ eur(a.realized_ytd) }} |
        | Still expected this year (dividends, interest) | {{ eur(a.expected_rest) }} |
        | Taxable after loss pots | {{ eur(a.taxable_expected) }} |
        | Allowance used | {{ eur(a.allowance_used) }} / {{ eur(a.allowance) }} |
        | Tax withheld so far | {{ eur(a.withheld_ytd) }} |
        | Loss pot stocks | {{ eur(a.loss_pot_stock) }} |
        | Loss pot other | {{ eur(a.loss_pot_general) }} |
        | Crypto sold within one year | {{ eur(a.private_sales_ytd) }} |
        {%- if p %}
        | Personal tax rate on capital income | {{ pct(p.personal_rate_pct) }} |
        | Flat tax on it | {{ eur(p.flat_tax) }} |
        | Personal tax on it | {{ eur(p.personal_tax) }} |
        | Room below the basic allowance | {{ eur(p.headroom) }} |
        {%- endif %}

        | Year | Taxable | Withheld | Loss pot stocks | Loss pot other |
        |:--|--:|--:|--:|--:|
        {%- for h in a.history or [] %}
        | {{ h.year }} | {{ eur(h.taxable) }} | {{ eur(h.withheld) }} | {{ eur(h.loss_pot_stock) }} | {{ eur(h.loss_pot_general) }} |
        {%- endfor %}

        *ETFs count as equity funds, 30 % of their income is tax free. Saveback, stock perks, and bonuses are not included. Pots are simulated from your exports and can differ from Trade Republic's.*
  - type: grid
    cards:
    - type: heading
      heading: Sell and buy back
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- set rs = state_attr('sensor.trade_republic_tax_allowance_left', 'reset') or [] %}
        {%- if rs %}
        | Position | Shares | Proceeds | Taxable gain | Uses the allowance |
        |:--|--:|--:|--:|:--|
        {%- for r in rs %}
        | {{ r.name }} | {{ '%.3f' | format(r.shares) | replace('.', ',') }} | {{ eur(r.proceeds) }} | {{ eur(r.taxable_gain) }} | {{ tr.get('Fully' if r.covers else 'Partly', 'Fully' if r.covers else 'Partly') }} |
        {%- endfor %}

        A row marked Fully uses up the unused allowance on its own. Partly means the whole position is not enough, so rows can be combined. Trade Republic sells the oldest purchases first, so the share count follows that order. Buying back right after the sale keeps the position. Fees and spread are not included.
        {%- else %}
        No unused allowance worth a sale and buyback right now.
        {%- endif %}
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- set ls = state_attr('sensor.trade_republic_tax_allowance_left', 'losses') or [] %}
        {%- if ls %}
        **Positions with losses**

        | Position | Loss pot | Loss, taxable part | Would save now |
        |:--|:--|--:|--:|
        {%- for l in ls %}
