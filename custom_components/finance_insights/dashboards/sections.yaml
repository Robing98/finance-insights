# Dashboard building blocks for the build_dashboard action.
# Per account type and topic: a list of sections. English texts; de.yaml has the German ones.
# Markdown cards can use dt(date) and tr.get(value, value), which the builder defines per language.
# Entity IDs use the default prefixes
# (trade_republic, sparkasse, finance_overview, electricity) and are rewritten for each account.
trade_republic:
  overview:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Trade Republic
    - type: custom:finance-insights-kpis
      compact: true
      items:
      - entity: sensor.trade_republic_net_worth
        name: Net worth
        icon: mdi:scale-balance
        color: mint
      - entity: sensor.trade_republic_total_return
        name: Total return
        icon: mdi:finance
        color: mint
        signed: true
      - entity: sensor.trade_republic_unrealized_pct
        name: Unrealized P&L %
        icon: mdi:percent
        color: mint
        signed: true
      - entity: sensor.trade_republic_cash
        name: Broker cash
        icon: mdi:cash
        color: sky
      - entity: sensor.trade_republic_dividend_income_forward
        name: Expected dividends (12 months)
        icon: mdi:cash-clock
        color: mint
      - entity: sensor.trade_republic_next_dividend
        name: Next dividend
        icon: mdi:calendar-star
        color: amber
        secondary_attribute: name
      - entity: sensor.trade_republic_spending_30d
        name: Card spending, 30 days
        icon: mdi:credit-card-outline
        color: coral
        compare_entity: sensor.trade_republic_spending_avg_12m
        invert: true
      - entity: sensor.trade_republic_income_ytd
        name: Investment income this year
        icon: mdi:hand-coin
        color: violet
  portfolio:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Portfolio
    - type: custom:finance-insights-kpis
      items:
      - entity: sensor.trade_republic_net_worth
        name: Net worth
        icon: mdi:scale-balance
        color: mint
      - entity: sensor.trade_republic_total_return
        name: Total return
        icon: mdi:finance
        color: mint
        signed: true
      - entity: sensor.trade_republic_holdings_value
        name: Holdings value
        icon: mdi:chart-line
        color: mint
        secondary_entity: sensor.trade_republic_holdings_cost
        secondary_label: Cost
      - entity: sensor.trade_republic_unrealized_pct
        name: Unrealized P&L %
        icon: mdi:percent
        color: mint
        signed: true
        secondary_entity: sensor.trade_republic_unrealized
        secondary_label: Unrealized P&L
      - entity: sensor.trade_republic_cash
        name: Broker cash
        icon: mdi:cash
        color: sky
      - entity: sensor.trade_republic_realized
        name: Realized P&L
        icon: mdi:cash-check
        color: violet
        signed: true
        secondary_entity: sensor.trade_republic_realized_ytd
        secondary_label: This year
  - type: grid
    column_span: 2
    cards:
    - type: custom:finance-insights-line
      title: Net worth vs. contributions
      days: 180
      series:
      - entity: sensor.trade_republic_net_worth
        name: Net worth
        color: mint
        fill: true
      - entity: sensor.trade_republic_net_contributions
        name: Net contributions
        color: muted
        dashed: true
  - type: grid
    cards:
    - type: custom:finance-insights-donut
      title: Allocation
      entity: sensor.trade_republic_holdings_value
      attribute: allocation
      center: Holdings
      parts:
      - key: FUND
        name: Funds
        color: mint
      - key: STOCK
        name: Stocks
        color: coral
      - key: BOND
        name: Bonds
        color: violet
      - key: CRYPTO
        name: Crypto
        color: amber
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Holdings
    - type: custom:finance-insights-table
      holdings: trade_republic
      strip_name: 'Trade Republic '
      sort: weight_pct
      empty: No open positions.
      columns:
      - key: name
        name: Position
      - key: state
        name: Value
        format: eur
      - key: unrealized_pct
        name: P&L
        format: pct_signed
      - key: dividends
        name: Dividends
        format: eur
        only_if: dividends
      - key: return_incl_dividends_pct
        name: Incl. div.
        format: pct_signed
        only_if: dividends
      - key: weight_pct
        name: Share
        format: pct
        bar: true
        color: mint
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Events on your holdings
    - type: custom:finance-insights-table
      entity: sensor.trade_republic_holding_events
      attribute: items
      limit: 12
      empty: Nothing has happened to your positions since the last check.
      note: Built from your provider's dividend dates and the broker's own bookings. Nothing is fetched for this, and no holding is sent anywhere.
      columns:
      - key: date
        name: Date
        format: date
      - key: name
        name: Position
      - key: kind
        name: Event
        map:
          dividend_announced: Dividend announced
          dividend_raised: Dividend raised
          dividend_cut: Dividend cut
          dividend_late: Payment overdue
          corporate_action: Corporate action
          split: Split
      - key: change_pct
        name: Change
        format: pct_signed
  - type: grid
    cards:
    - type: heading
      heading: Checks
    - type: custom:finance-insights-table
      entity: sensor.trade_republic_portfolio_checks
      attribute: checks
      empty: Nothing to check yet.
      note: Measurements of your portfolio, not advice. What to do about them is your decision.
      columns:
      - key: key
        name: Check
        warn_key: level
        warn_ok: ok
        map:
          concentration: Largest position
          top5: Five largest positions
          cash: Cash not invested
          unpriced: Positions without a price
          stale_prices: Prices from an old trade
          dividend_concentration: Dividends from one payer
          foreign_dividends: Dividends in a foreign currency
          fees: Order fees, last 12 months
      - key: value
        name: Measured
        format: number
        align: end
      - key: unit
        name: ''
        map:
          '%': '%'
          positions: positions
      - key: level
        name: Result
        align: end
        map:
          ok: Unremarkable
          note: Worth knowing
          watch: Worth a look
  bonds:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Bonds held to maturity
    - type: custom:finance-insights-kpis
      items:
      - entity: sensor.trade_republic_bonds_profit_to_maturity
        name: Profit to maturity
        icon: mdi:cash-plus
        color: mint
        signed: true
      - entity: sensor.trade_republic_next_bond_coupon
        name: Next coupon
        icon: mdi:calendar-star
        color: amber
        secondary_attribute: bond
    - type: custom:finance-insights-table
      entity: sensor.trade_republic_bonds_profit_to_maturity
      attribute: bonds
      alert:
        attribute: doubtful
        text: 'Repayment doubtful for: {}. A coupon was missed or the market price implies an extreme yield; the market value is the realistic figure.'
      note: Gross, before tax. Add bonds.csv (isin,coupon,maturity,frequency) to the export folder for bonds without known terms.
      empty: No bonds held.
      columns:
      - key: name
        name: Bond
        warn_key: status
      - key: invested
        name: Invested
        format: eur2
      - key: coupons_received
        name: Coupons in
        format: eur2
      - key: coupons_due
        name: Coupons due
        format: eur2
      - key: profit_to_maturity
        name: Profit to maturity
        format: eur_signed
      - key: return_pa
        name: p.a.
        format: pct
  dividends:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Dividends
    - type: custom:finance-insights-kpis
      items:
      - entity: sensor.trade_republic_dividend_income_forward
        name: Expected dividends (12 months)
        icon: mdi:cash-clock
        color: mint
      - entity: sensor.trade_republic_dividends_12m
        name: Received (12 months)
        icon: mdi:cash-check
        color: mint
      - entity: sensor.trade_republic_dividend_yield
        name: Dividend yield
        icon: mdi:percent-circle-outline
        color: mint
      - entity: sensor.trade_republic_dividend_yield_on_cost
        name: Yield on cost
        icon: mdi:percent-box-outline
        color: violet
      - entity: sensor.trade_republic_next_dividend
        name: Next dividend
        icon: mdi:calendar-star
        color: amber
        secondary_attribute: name
      - entity: sensor.trade_republic_real_dividend_yield
        name: Real dividend yield
        icon: mdi:chart-bell-curve
        color: sky
        signed: true
  - type: grid
    column_span: 2
    cards:
    - type: custom:finance-insights-bars
      title: Expected dividends, next 12 months
      note: Gross, before tax.
      entity: sensor.trade_republic_dividend_income_forward
      attribute: calendar
      series:
      - key: amount
        name: Expected
        color: mint
  - type: grid
    cards:
    - type: custom:finance-insights-compare
      title: Dividend yield compared
      items:
      - entity: sensor.trade_republic_dividend_yield
        name: Dividend yield
        color: mint
      - entity: sensor.trade_republic_dividend_yield
        attribute: yield_on_cost_pct
        name: Yield on cost
        color: violet
      - entity: sensor.trade_republic_tr_cash_interest_rate
        name: Cash interest
        color: sky
      - entity: sensor.trade_republic_ecb_deposit_rate
        name: ECB deposit rate
        color: muted
      - entity: sensor.trade_republic_dividend_yield
        attribute: benchmarks.bonds_ytm
        name: Bonds to maturity
        color: amber
      - entity: sensor.trade_republic_inflation_rate
        name: Inflation
        color: coral
  - type: grid
    column_span: 3
    cards:
    - type: custom:finance-insights-table
      entity: sensor.trade_republic_dividend_income_forward
      attribute: upcoming
      title: Upcoming
      empty: No dividends expected yet. Add a dividend data provider under Configure, or wait for the first payment.
      columns:
      - key: name
        name: Stock
      - key: next_ex_date
        name: Ex date
        format: date
        estimated_key: estimated
      - key: next_pay_date
        name: Pay date
        format: date
        estimated_key: estimated
      - key: next_amount
        name: Per share
        format: eur2
      - key: next_total
        name: Total
        format: eur2
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Per stock
    - type: custom:finance-insights-table
      entity: sensor.trade_republic_dividend_yield
      attribute: stocks
      note: 'Yield: expected dividend per share over the current price. On cost: over your average buy-in. Paid back: dividends received over what you paid. Payback in: years until dividends cover the rest
        of the buy-in at today''s rate. All gross, before tax.'
      columns:
      - key: name
        name: Stock
      - key: yield_pct
        name: Yield
        format: pct
        dec: 2
      - key: yield_on_cost_pct
        name: On cost
        format: pct
        dec: 2
      - key: annual_income
        name: Per year
        format: eur2
      - key: received
        name: Received
        format: eur2
      - key: payback_pct
        name: Paid back
        format: pct
      - key: years_to_payback
        name: Payback in
        format: years
      - key: growth_pct
        name: Growth p.a.
        format: pct
      - key: years_without_cut
        name: Years without cut
        format: count
    - type: custom:finance-insights-table
      entity: sensor.trade_republic_dividend_yield
      attribute: ranking
      title: Compared with other dividend stocks
      hide_empty: true
      columns:
      - key: name
        name: Stock
      - key: held
        name: Where
        map:
          'True': Depot
          'true': Depot
        map_default: Watchlist
      - key: yield_pct
        name: Yield
        format: pct
        dec: 2
      - key: growth_pct
        name: Growth p.a.
        format: pct
      - key: years_without_cut
        name: Years without cut
        format: count
      - key: frequency
        name: Payments per year
        format: count
      - key: next_ex_date
        name: Next ex date
        format: date
      - key: real_yield_pct
        name: After inflation
        format: pct_signed
        dec: 2
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Benchmarks
    - type: custom:finance-insights-line
      title: Rates over time
      unit: '%'
      days: 1100
      series:
      - entity: sensor.trade_republic_ecb_deposit_rate
        attribute: history
        x: period
        y: value
        name: ECB deposit rate
        color: sky
        step: true
      - entity: sensor.trade_republic_inflation_rate
        attribute: history
        x: period
        y: value
        name: Inflation
        color: coral
      - entity: sensor.trade_republic_dividend_yield
        constant: true
        name: Your dividend yield
        color: mint
        dashed: true
  - type: grid
    cards:
    - type: custom:finance-insights-kpis
      compact: true
      min_width: 150
      items:
      - entity: sensor.trade_republic_ecb_deposit_rate
        name: ECB deposit rate
        icon: mdi:bank-outline
        color: sky
      - entity: sensor.trade_republic_inflation_rate
        name: Inflation
        icon: mdi:trending-up
        color: coral
      - entity: sensor.trade_republic_tr_cash_interest_rate
        name: Cash interest
        icon: mdi:cash-sync
        color: mint
        secondary: From your last interest payment.
    - type: custom:finance-insights-table
      entity: sensor.trade_republic_dividend_income_forward
      attribute: per_year
      title: Dividends received per year
      reverse: true
      columns:
      - key: key
        name: Year
      - key: value
        name: Gross
        format: eur2
  taxes:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Taxes
    - type: custom:finance-insights-kpis
      items:
      - entity: sensor.trade_republic_tax_allowance_left
        name: Tax allowance left
        icon: mdi:shield-check-outline
        color: mint
        progress_attribute: allowance_used
        progress_total_attribute: allowance
      - entity: sensor.trade_republic_tax_expected
        name: Expected capital gains tax
        icon: mdi:bank-transfer-out
        color: coral
      - entity: sensor.trade_republic_taxes_ytd
        name: Taxes this year
        icon: mdi:receipt-text-outline
        color: violet
      - entity: sensor.trade_republic_tax_refund_estimate
        name: Refund via Günstigerprüfung
        icon: mdi:cash-refund
        color: sky
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- set tips = state_attr('sensor.trade_republic_tax_allowance_left', 'tips') or [] %}
        {%- for x in tips %}
        {%- if x.code == 'enter_income' %}
        - **Günstigerprüfung and NV-Bescheinigung:** enter your expected taxable income without capital income under **Configure** to see whether either pays off.
        {%- elif x.code == 'nv' %}
        - **NV-Bescheinigung:** your estimated income stays below the basic allowance. With an NV-Bescheinigung from the tax office (form NV 1 A), Trade Republic withholds no tax. Tax withheld this year so far: {{ eur(x.amount) }}, which comes back with the tax return.
        {%- elif x.code == 'guenstiger' %}
        - **Günstigerprüfung:** your personal tax rate is below 25 %. Estimated refund when you apply for it in Anlage KAP: {{ eur(x.amount) }}.
        {%- elif x.code == 'reset' %}
        - **Unused allowance:** about {{ eur(x.amount) }} are unused this year. Gains realized by December 31 up to that amount stay tax free for good, even if you buy the position back right away. Tax saved later: about {{ eur(x.benefit) }}. Selling and buying back on the same day is not an abuse of law (BFH, IX R 60/07).
        {%- elif x.code == 'losses' %}
        - **Unrealized losses:** tax is withheld on part of your capital income this year. A realized loss offsets it. Saving for the largest one right now: {{ eur(x.amount) }}.
        {%- elif x.code == 'stock_pot' %}
        - **Stock loss pot:** about {{ eur(x.amount) }}. It only offsets gains from selling stocks, not dividends, interest, or ETF gains.
        {%- elif x.code == 'loss_certificate' %}
        - **Loss certificate:** to offset losses at Trade Republic against gains at another bank, request a Verlustbescheinigung by December 15. Otherwise the loss pot carries over at Trade Republic.
        {%- elif x.code == 'fsa' %}
        - **Freistellungsauftrag:** {{ eur(x.amount) }} at Trade Republic, and tax is already withheld. Without capital income at other banks, it can go up to {{ eur(x.limit) }}. You change it in the app.
        {%- elif x.code == 'crypto_free' %}
        - **{{ x.name }}:** tax free sale of the oldest taxable purchase from {{ dt(x.date) }}.
        {%- elif x.code == 'crypto_limit' and x.over %}
        - **Crypto sold within one year:** {{ eur(x.amount) }} gain this year. That is above the {{ eur(x.limit) }} limit, so the whole gain belongs in your tax return as a private sale.
        {%- elif x.code == 'crypto_limit' %}
        - **Crypto sold within one year:** {{ eur(x.amount) }} gain this year. It stays tax free while all such gains together stay below {{ eur(x.limit) }}. Above that, the whole gain is taxed.
        {%- elif x.code == 'crypto_rewards' %}
        - **Crypto rewards:** {{ eur(x.amount) }} this year. They count as other income. Tax free limit for all such income together: {{ eur(x.limit) }}.
        {%- elif x.code == 'vorabpauschale' %}
        - **Vorabpauschale:** accumulating ETFs are taxed on the first working day of January. The new year's allowance is used first, any tax beyond it is taken from your cash.
        {%- endif %}
        {%- endfor %}

        *Estimates from your exports, not tax advice. Trade Republic's tax report and your tax assessment are binding.*
  - type: grid
    cards:
    - type: custom:finance-insights-facts
      title: This year
      entity: sensor.trade_republic_tax_allowance_left
      rows:
      - name: Capital income so far, taxable part
        attribute: income_ytd
      - name: Realized gains and losses, taxable part
        attribute: realized_ytd
      - name: Still expected this year (dividends, interest)
        attribute: expected_rest
      - name: Taxable after loss pots
        attribute: taxable_expected
        strong: true
      - name: Allowance used
        attribute: allowance_used
        total_attribute: allowance
      - name: Tax withheld so far
        attribute: withheld_ytd
      - name: Loss pot stocks
        attribute: loss_pot_stock
      - name: Loss pot other
        attribute: loss_pot_general
      - name: Crypto sold within one year
        attribute: private_sales_ytd
      - name: Personal tax rate on capital income
        attribute: personal.personal_rate_pct
        format: pct
        optional: true
      - name: Flat tax on it
        attribute: personal.flat_tax
        optional: true
      - name: Personal tax on it
        attribute: personal.personal_tax
        optional: true
      - name: Room below the basic allowance
        attribute: personal.headroom
        optional: true
      note: ETFs count as equity funds, 30 % of their income is tax free. Saveback, stock perks, and bonuses are not included. Pots are simulated from your exports and can differ from Trade Republic's.
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Sell and buy back
    - type: custom:finance-insights-table
      entity: sensor.trade_republic_tax_allowance_left
      attribute: reset
      empty: No unused allowance worth a sale and buyback right now.
      note: A row marked Fully uses up the unused allowance on its own. Partly means the whole position is not enough, so rows can be combined. Trade Republic sells the oldest purchases first, so the share
        count follows that order. Buying back right after the sale keeps the position. Fees and spread are not included.
      columns:
      - key: name
        name: Position
      - key: shares
        name: Shares
        format: shares
        dec: 3
      - key: proceeds
        name: Proceeds
        format: eur2
      - key: taxable_gain
        name: Taxable gain
        format: eur2
      - key: covers
        name: Uses the allowance
        map:
          'True': Fully
          'true': Fully
        map_default: Partly
        align: start
    - type: custom:finance-insights-table
      entity: sensor.trade_republic_tax_allowance_left
      attribute: losses
      title: Positions with losses
      hide_empty: true
      note: A loss only saves tax now if tax is withheld this year. Otherwise it stays in the loss pot for later years.
      columns:
      - key: name
        name: Position
      - key: pot
        name: Loss pot
        map:
          stock: Stocks
        map_default: Other
      - key: loss
        name: Loss, taxable part
        format: eur2
      - key: saves_now
        name: Would save now
        format: eur2
    - type: custom:finance-insights-table
      entity: sensor.trade_republic_tax_allowance_left
      attribute: crypto
      title: Crypto holding periods
      hide_empty: true
      note: Crypto held longer than one year is tax free when sold.
      columns:
      - key: name
        name: Coin
      - key: tax_free_shares
        name: Tax free
        format: shares
      - key: taxable_shares
        name: Still taxable
        format: shares
      - key: taxable_gain
        name: Gain still taxable
        format: eur2
      - key: next_tax_free
        name: Tax free from
        format: date
    - type: custom:finance-insights-table
      entity: sensor.trade_republic_tax_allowance_left
      attribute: history
      title: Previous years
      hide_empty: true
      columns:
      - key: year
        name: Year
      - key: taxable
        name: Taxable
        format: eur2
      - key: withheld
        name: Withheld
        format: eur2
      - key: loss_pot_stock
        name: Loss pot stocks
        format: eur2
      - key: loss_pot_general
        name: Loss pot other
        format: eur2
  spending:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Card spending
    - type: custom:finance-insights-kpis
      items:
      - entity: sensor.trade_republic_spending_30d
        name: Card spending, 30 days
        icon: mdi:credit-card-outline
        color: coral
        compare_entity: sensor.trade_republic_spending_avg_12m
        invert: true
      - entity: sensor.trade_republic_spending_prev_30d
        name: The 30 days before
        icon: mdi:calendar-arrow-left
        color: coral
      - entity: sensor.trade_republic_spending_ytd
        name: This year
        icon: mdi:calendar-range
        color: coral
      - entity: sensor.trade_republic_spending_avg_12m
        name: Average per month (12 months)
        icon: mdi:chart-bell-curve-cumulative
        color: coral
        secondary: Refunds netted in.
  - type: grid
    column_span: 2
    cards:
    - type: custom:finance-insights-bars
      title: Spending per month by group
      stacked: true
      months: 12
      entity: sensor.trade_republic_spending_ytd
      attribute: monthly
      series:
      - key: Food and drink
        name: Food and drink
        color: sky
      - key: Shopping
        name: Shopping
        color: coral
      - key: Home
        name: Home
        color: mint
      - key: Subscriptions
        name: Subscriptions
        color: amber
      - key: Transport and travel
        name: Transport and travel
        color: rose
      - key: Other
        name: Other
        color: muted
  - type: grid
    cards:
    - type: custom:finance-insights-donut
      title: Where the money went (12 months)
      entity: sensor.trade_republic_spending_ytd
      attribute: groups_12m
      center: 12 months
      parts:
      - key: Food and drink
        name: Food and drink
        color: sky
      - key: Shopping
        name: Shopping
        color: coral
      - key: Home
        name: Home
        color: mint
      - key: Subscriptions
        name: Subscriptions
        color: amber
      - key: Transport and travel
        name: Transport and travel
        color: rose
      - key: Other
        name: Other
        color: muted
  - type: grid
    cards:
    - type: custom:finance-insights-table
      entity: sensor.trade_republic_spending_ytd
      attribute: categories_12m
      title: Categories, last 12 months
      columns:
      - key: 0
        name: Category
        translate: true
      - key: 1
        name: Amount
        format: eur
        bar: true
        color: coral
      - key: 1
