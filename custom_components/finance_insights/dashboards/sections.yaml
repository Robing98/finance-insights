      - decimals: 0
        apex_config:
          labels:
            formatter: EVAL:function(v){return Math.round(v) + ' €'}
      apex_config:
        tooltip:
          y:
            formatter: EVAL:function(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
      series:
      - entity: sensor.electricity_cost_month
        name: Cost
        color: '#eda100'
        type: column
        data_generator: return (entity.attributes.monthly || []).map(m => [new Date(m.month + '-15T00:00:00').getTime(), m.cost || 0]);
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Contract and forecast
    - type: tile
      entity: sensor.electricity_contract_end
    - type: tile
      entity: sensor.electricity_notice_deadline
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        {%- set f = state_attr('sensor.electricity_expected_period_cost', 'method') %}
        {%- set a = states.sensor.electricity_expected_period_cost.attributes if states.sensor.electricity_expected_period_cost else {} %}
        {%- if a.get('period_start') %}
        **Billing year {{ dt(a.period_start) }} to {{ dt(a.period_end) }}** · {{ a.period_supplier or '–' }}

        | | |
        |:--|--:|
        | Cost so far | {{ eur(a.period_cost) }} |
        | Expected for the year | {{ eur(a.expected_cost) }} |
        | Advance payments so far | {{ eur(a.period_advances_paid) }} |
        | Advance payments for the year | {{ eur(a.period_advances_total) }} |
        | Bonus | {{ eur(a.period_bonus) }} |
        | **Expected refund (negative: extra payment)** | **{{ eur(states('sensor.electricity_expected_settlement') | float(0)) }}** |
        | Suggested advance payment | {{ eur(states('sensor.electricity_suggested_advance') | float(0)) }} |

        Forecast from {{ 'the same days last year' if f == 'last year' else 'the average of the last 30 days' }}.
        {%- else %}
        No contract yet. Open the entry under **Settings > Devices & services > Finance Insights** and select **Add contract**.
        {%- endif %}
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        **Contracts**

        | Supplier | Start | End | Price | Base price | Advance |
        |:--|:--|:--|--:|--:|--:|
        {%- for c in (state_attr('sensor.electricity_contract_end', 'contracts') or []) | reverse %}
        | {{ c.supplier }} | {{ dt(c.start) }} | {{ dt(c.end) }} | {{ '%.4f' | format(c.unit_price | float(0)) | replace('.', ',') }} € | {{ eur(c.base_price) }} | {{ eur(c.advance) }} |
        {%- endfor %}
  - type: grid
    cards:
    - type: heading
      heading: Devices this month
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- macro eur(v) -%}{{ '{:,.2f}'.format(v) | replace(',', 'X') | replace('.', ',') | replace('X', '.') ~ ' €' if v is not none else '–' }}{%- endmacro -%}
        | Device | Consumption | Cost |
        |:--|--:|--:|
        {%- for d in state_attr('sensor.electricity_contract_end', 'devices') or [] %}
        | {{ d.name }} | {{ '%.1f' | format(d.consumption) | replace('.', ',') }} | {{ eur(d.cost) }} |
        {%- endfor %}

        Devices come from **Individual devices** in the energy dashboard.
  data:
  - type: grid
    cards:
    - type: heading
      heading: Data
    - type: entities
      entities:
      - sensor.electricity_data_status
      - button.electricity_refresh
